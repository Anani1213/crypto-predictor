name: Deploy Crypto Predictor to GitHub Pages

on:
  push:
    branches:
      - main # የ branch-ህ ስም main ካልሆነ እዚህ ጋር አስተካክለው (ለምሳሌ master)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Inject Gemini API Key into HTML
        # ይህ ኮድ `___GEMINI_API_KEY___` የሚለውን ፈልጎ አንተ በፎቶው ባሳየኸኝ Secret ይተካዋል
        run: |
          sed -i "s/___GEMINI_API_KEY___/${{ secrets.GEMINI_API_KEY }}/g" index.html

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v2
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

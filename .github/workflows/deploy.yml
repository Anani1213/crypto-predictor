name: Crypto AI Predictor Bot

on:
  schedule:
    # በየ 15 ደቂቃው አውቶማቲክ እንዲሰራ (Cron)
    - cron: '*/15 * * * *'
  workflow_dispatch: # በእጅ መጀመር ሲፈልጉ

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Code Checkout
        uses: actions/checkout@v3

      - name: Python ማዋቀር
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: የሚያስፈልጉ Packages መጫን
        run: |
          pip install requests

      - name: የ Python AI ትንተናን Run ማድረግ
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python fetch_and_predict.py

      - name: አዲሱን data.json ወደ GitHub ማቀበል (Commit)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto update predictions [skip ci]" || exit 0
          git push

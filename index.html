<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto AI Predictor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #0b0e11; color: #f3f4f6; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 500px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; width: 100%; }
        .logo { font-size: 20px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .update-time { font-size: 12px; color: #9ca3af; background: #1f2937; padding: 6px 12px; border-radius: 20px; }
        
        /* Dashboard List Style */
        .coin-list { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .coin-card { background: #161b22; border: 1px solid #30363d; border-radius: 14px; padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
        .coin-card:hover { border-color: #38bdf8; background: #1f242c; }
        .coin-info { display: flex; flex-direction: column; gap: 4px; }
        .coin-name { font-size: 16px; font-weight: 600; color: #fff; }
        .coin-symbol { font-size: 12px; color: #9ca3af; }
        .coin-price-box { text-align: right; }
        .coin-price { font-size: 16px; font-weight: 600; color: #fff; }
        .coin-change { font-size: 12px; font-weight: 500; }
        .positive { color: #10b981; }
        .negative { color: #ef4444; }

        /* Detail View Style */
        #detail-view { display: none; width: 100%; flex-direction: column; gap: 20px; }
        .back-btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 500; width: fit-content; transition: 0.2s; }
        .back-btn:hover { background: #30363d; color: #fff; }
        
        .detail-card { background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .signal-badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; width: fit-content; display: flex; align-items: center; gap: 6px; }
        .badge-bullish { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-bearish { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        
        .price-display { font-size: 28px; font-weight: 700; color: #fff; }
        .chart-container { position: relative; width: 100%; height: 220px; margin-top: 10px; }
        
        .summary-box { background: #0d1117; border-left: 3px solid #38bdf8; padding: 12px; border-radius: 0 8px 8px 0; font-size: 13px; color: #9ca3af; line-height: 1.5; }

        /* Footer Style */
        footer { margin-top: 30px; text-align: center; font-size: 11px; color: #6b7280; width: 100%; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">⚡ Crypto AI Predictor</div>
            <div id="update-time" class="update-time">Loading...</div>
        </header>

        <!-- HOME DASHBOARD VIEW -->
        <div id="home-view">
            <div id="coin-list" class="coin-list">
                <!-- Coins will be loaded here dynamically -->
            </div>
        </div>

        <!-- DETAIL VIEW -->
        <div id="detail-view">
            <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
            <div class="detail-card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h2 id="det-title" style="font-size: 20px; font-weight: 700; color: #fff;">BTC</h2>
                        <span id="det-subtitle" style="font-size: 12px; color: #9ca3af;">Tether US</span>
                    </div>
                    <div id="det-badge" class="signal-badge badge-bullish">BULLISH</div>
                </div>
                <div>
                    <div id="det-price" class="price-display">$0.00</div>
                    <div id="det-change" class="coin-change positive">+0.00% (24h)</div>
                </div>
                <div class="chart-container">
                    <canvas id="cryptoChart"></canvas>
                </div>
                <div id="det-summary" class="summary-box">
                    Analyzing market conditions...
                </div>
            </div>
        </div>

        <footer>Powered by ethio programmer</footer>
    </div>

    <script>
        let globalData = [];
        let myChart = null;

        async function loadData() {
            try {
                let response = await fetch('data.json?t=' + new Date().getTime());
                let json = await response.json();
                globalData = json.data;
                document.getElementById('update-time').innerText = "Updated: " + json.updated_at.split(" ")[1] + " UTC";
                
                renderCoinList();
            } catch (e) {
                console.error("Error loading data:", e);
                document.getElementById('coin-list').innerHTML = `<p style="text-align:center; color:#ef4444;">Failed to load data. Please run GitHub Actions.</p>`;
            }
        }

        function renderCoinList() {
            let listHTML = '';
            globalData.forEach((item, index) => {
                let isPos = item.market.price_change_pct >= 0;
                let changeClass = isPos ? 'positive' : 'negative';
                let sign = isPos ? '+' : '';
                
                listHTML += `
                    <div class="coin-card" onclick="openDetail(${index})">
                        <div class="coin-info">
                            <span class="coin-name">${item.symbol}</span>
                            <span class="coin-symbol">${item.full_symbol}</span>
                        </div>
                        <div class="coin-price-box">
                            <div class="coin-price">$${item.market.price.toLocaleString(undefined, {minimumFractionDigits: 2})}</div>
                            <div class="coin-change ${changeClass}">${sign}${item.market.price_change_pct.toFixed(2)}%</div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('coin-list').innerHTML = listHTML;
        }

        function openDetail(index) {
            let item = globalData[index];
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'flex';

            document.getElementById('det-title').innerText = item.symbol;
            document.getElementById('det-subtitle').innerText = item.full_symbol;
            document.getElementById('det-price').innerText = `$${item.market.price.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            
            let isPos = item.market.price_change_pct >= 0;
            let changeEl = document.getElementById('det-change');
            changeEl.className = `coin-change ${isPos ? 'positive' : 'negative'}`;
            changeEl.innerText = `${isPos ? '+' : ''}${item.market.price_change_pct.toFixed(2)}% (24h)`;

            let badge = document.getElementById('det-badge');
            if (item.ai.signal === "BULLISH") {
                badge.className = "signal-badge badge-bullish";
                badge.innerHTML = `🚀 BULLISH (${item.ai.confidence}%)`;
            } else {
                badge.className = "signal-badge badge-bearish";
                badge.innerHTML = `🔻 BEARISH (${item.ai.confidence}%)`;
            }

            document.getElementById('det-summary').innerText = item.ai.summary;

            renderChart(item.market.history, [item.ai.pred_15m, item.ai.pred_30m, item.ai.pred_60m]);
        }

        function goBack() {
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            if (myChart) myChart.destroy();
        }

        function renderChart(history, predictions) {
            const ctx = document.getElementById('cryptoChart').getContext('2d');
            if (myChart) myChart.destroy();

            let labels = [];
            for (let i = history.length; i > 0; i--) {
                labels.push(`-${i * 15}m`);
            }
            labels.push("Now");
            labels.push("+15m");
            labels.push("+30m");
            labels.push("+60m");

            let historyDataPoints = [...history, history[history.length - 1]];
            let predictionDataPoints = new Array(history.length).fill(null);
            predictionDataPoints.push(history[history.length - 1]);
            predictionDataPoints.push(...predictions);

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Market History',
                            data: historyDataPoints,
                            borderColor: '#38bdf8',
                            backgroundColor: 'rgba(56, 189, 248, 0.1)',
                            fill: true,
                            tension: 0.3,
                            pointRadius: 2
                        },
                        {
                            label: 'AI Prediction',
                            data: predictionDataPoints,
                            borderColor: '#10b981',
                            borderDash: [5, 5],
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            fill: true,
                            tension: 0.3,
                            pointRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#21262d' }, ticks: { color: '#8b949e', font: { size: 10 } } },
                        y: { grid: { color: '#21262d' }, ticks: { color: '#8b949e', font: { size: 10 } } }
                    }
                }
            });
        }

        loadData();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto AI Predictor - Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', Arial, sans-serif; }
        body { background-color: #202124; color: #e8eaed; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 800px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; width: 100%; border-bottom: 1px solid #3c4043; padding-bottom: 16px; }
        .logo { font-size: 22px; font-weight: 500; color: #8ab4f8; display: flex; align-items: center; gap: 8px; }
        .update-time { font-size: 13px; color: #81c995; background: rgba(129, 201, 149, 0.1); border: 1px solid rgba(129, 201, 149, 0.3); padding: 6px 14px; border-radius: 20px; display: flex; align-items: center; gap: 8px; }
        .live-dot { width: 8px; height: 8px; background-color: #81c995; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .coin-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; width: 100%; }
        .coin-card { background: #292a2d; border: 1px solid #3c4043; border-radius: 12px; padding: 18px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
        .coin-card:hover { background: #323639; border-color: #8ab4f8; transform: translateY(-2px); }
        .coin-name { font-size: 18px; font-weight: 500; color: #fff; }
        .coin-symbol { font-size: 13px; color: #9aa0a6; display: block; margin-top: 4px; }
        .coin-price-box { text-align: right; }
        .coin-price { font-size: 18px; font-weight: 500; color: #fff; }
        .coin-change { font-size: 13px; font-weight: 500; margin-top: 4px; display: block; }
        .positive { color: #81c995; }
        .negative { color: #f28b82; }
        #detail-view { display: none; width: 100%; flex-direction: column; gap: 20px; }
        .back-btn { background: #3c4043; border: none; color: #8ab4f8; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 14px; width: fit-content; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .back-btn:hover { background: #5f6368; }
        .detail-card { background: #292a2d; border: 1px solid #3c4043; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .top-info { display: flex; justify-content: space-between; align-items: flex-start; }
        .price-display { font-size: 42px; font-weight: 400; color: #fff; margin-top: 10px; letter-spacing: -1px; }
        .signal-badge { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
        .interactive-bar { background: #202124; border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #9aa0a6; border: 1px solid #3c4043; min-height: 45px; }
        .hover-data-point { display: flex; gap: 16px; }
        .data-label { color: #9aa0a6; }
        .data-value { color: #fff; font-weight: 500; }
        .chart-container { position: relative; width: 100%; height: 350px; margin-top: 10px; }
        .ai-analysis-box { background: rgba(138, 180, 248, 0.05); border-left: 4px solid #8ab4f8; padding: 16px; border-radius: 0 8px 8px 0; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .ai-title { font-size: 12px; color: #8ab4f8; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .ai-text { font-size: 14px; color: #e8eaed; line-height: 1.5; }
        footer { margin-top: 30px; text-align: center; font-size: 12px; color: #5f6368; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">⚡ Crypto AI Predictor</div>
            <div class="update-time"><div class="live-dot"></div> Live Multi-Source Sync</div>
        </header>

        <div id="home-view">
            <div id="coin-list" class="coin-list">
                <p style="text-align: center; color: #9aa0a6; padding: 20px; grid-column: 1 / -1;">Connecting to live market data...</p>
            </div>
        </div>

        <div id="detail-view">
            <button class="back-btn" onclick="goBack()">← Back to Markets</button>
            <div class="detail-card">
                <div class="top-info">
                    <div>
                        <h2 id="det-title" style="font-size: 22px; font-weight: 500; color: #fff;">BTC <span id="det-subtitle" style="font-size: 14px; color: #9aa0a6; font-weight: 400;">USDT</span></h2>
                        <div id="det-price" class="price-display">$0.00</div>
                        <div id="det-change" class="coin-change positive">+0.00% today</div>
                    </div>
                    <div id="det-badge" class="signal-badge">Analyzing...</div>
                </div>
                
                <div class="interactive-bar">
                    <div id="hover-time" class="hover-data-point"><span class="data-label">Time:</span> <span class="data-value">Hover over chart</span></div>
                    <div id="hover-price" class="hover-data-point"><span class="data-label">Price:</span> <span class="data-value">---</span></div>
                    <div id="hover-type" class="hover-data-point"><span class="data-label">Type:</span> <span class="data-value" style="color: #8ab4f8;">Market Data</span></div>
                </div>

                <div class="chart-container">
                    <canvas id="cryptoChart"></canvas>
                </div>
                
                <div class="ai-analysis-box">
                    <div class="ai-title">✨ Gemini AI Future Prediction</div>
                    <div id="det-summary" class="ai-text">
                        Asking Gemini for future predictions...
                    </div>
                </div>
            </div>
        </div>
        <footer>Powered by ethio programmer</footer>
    </div>

    <script>
        // ይህንን GitHub Actions ራሱ በ Secret ይቀይረዋል
        const GEMINI_API_KEY = "___GEMINI_API_KEY___"; 

        const pairsList = [
            { symbol: "BTC", binance: "BTCUSDT" },
            { symbol: "ETH", binance: "ETHUSDT" },
            { symbol: "BNB", binance: "BNBUSDT" },
            { symbol: "SOL", binance: "SOLUSDT" }
        ];

        let marketData = {};
        let selectedCoin = null;
        let myChart = null;
        let aiPredictions = null;

        const crosshairPlugin = {
            id: 'crosshair',
            afterDraw: chart => {
                if (chart.tooltip._active && chart.tooltip._active.length) {
                    const activePoint = chart.tooltip._active[0];
                    const ctx = chart.ctx;
                    const x = activePoint.element.x;
                    const topY = chart.scales.y.top;
                    const bottomY = chart.scales.y.bottom;
                    ctx.save(); ctx.beginPath(); ctx.moveTo(x, topY); ctx.lineTo(x, bottomY);
                    ctx.lineWidth = 1; ctx.strokeStyle = '#5f6368'; ctx.stroke(); ctx.restore();
                }
            }
        };

        async function fetchMarketData() {
            try {
                let listHTML = '';
                for (let item of pairsList) {
                    let res = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${item.binance}`);
                    let data = await res.json();
                    let price = parseFloat(data.lastPrice);
                    let change = parseFloat(data.priceChangePercent);
                    
                    if (!marketData[item.symbol]) marketData[item.symbol] = {};
                    marketData[item.symbol].price = price;
                    marketData[item.symbol].change = change;

                    let isPos = change >= 0;
                    listHTML += `
                        <div class="coin-card" onclick="openDetail('${item.symbol}')">
                            <div>
                                <span class="coin-name">${item.symbol}</span>
                                <span class="coin-symbol">${item.binance}</span>
                            </div>
                            <div class="coin-price-box">
                                <div class="coin-price">$${price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4})}</div>
                                <div class="coin-change ${isPos ? 'positive' : 'negative'}">${isPos ? '+' : ''}${change.toFixed(2)}%</div>
                            </div>
                        </div>
                    `;
                }
                
                if (document.getElementById('home-view').style.display !== 'none') {
                    document.getElementById('coin-list').innerHTML = listHTML;
                }
                if (selectedCoin) updateDetailLive(selectedCoin);
            } catch (e) { console.error("Fetch error:", e); }
        }

        async function fetchGeminiPrediction(symbol, currentPrice) {
            document.getElementById('det-summary').innerText = "Gemini is analyzing the market structure to predict the next 3 hours...";
            
            if (GEMINI_API_KEY === "___" + "GEMINI_API_KEY___" || GEMINI_API_KEY === "") {
                document.getElementById('det-summary').innerText = "Error: Gemini API Key is missing. GitHub Actions injection failed or running locally.";
                return;
            }

            const prompt = `You are an expert AI crypto analyst. The current price of ${symbol} is $${currentPrice}. Based on general market momentum, predict the price for the next 1 hour, 2 hours, and 3 hours. 
            Respond ONLY with a valid JSON format like this exactly, nothing else:
            {"predictions": [price1, price2, price3], "analysis": "One sentence summary of trend."}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;
                const jsonMatch = aiText.match(/\{[\s\S]*\}/);
                
                if (jsonMatch) {
                    const aiData = JSON.parse(jsonMatch[0]);
                    aiPredictions = aiData.predictions;
                    document.getElementById('det-summary').innerText = aiData.analysis;
                    
                    // ግምቱን ካገኘ በኋላ ቻርቱን አፕዴት ያደርጋል
                    if (myChart && aiPredictions.length === 3) {
                        let predData = myChart.data.datasets[1].data;
                        predData[predData.length - 3] = aiPredictions[0];
                        predData[predData.length - 2] = aiPredictions[1];
                        predData[predData.length - 1] = aiPredictions[2];
                        myChart.update();
                        
                        let badge = document.getElementById('det-badge');
                        badge.innerHTML = `🚀 Gemini Synced`;
                        badge.style.background = 'rgba(129, 201, 149, 0.15)';
                        badge.style.color = '#8ab4f8';
                    }
                }
            } catch (error) {
                console.error("Gemini API Error:", error);
                document.getElementById('det-summary').innerText = "Gemini API request failed. Please check limits.";
            }
        }

        async function openDetail(symbol) {
            selectedCoin = symbol;
            aiPredictions = null;
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'flex';
            document.getElementById('det-title').innerHTML = `${symbol} <span style="font-size: 14px; color: #9aa0a6; font-weight: 400;">USDT</span>`;
            
            updateDetailLive(symbol);
            await loadGoogleStyleChart(symbol);
            
            if(marketData[symbol]) {
                fetchGeminiPrediction(symbol, marketData[symbol].price);
            }
        }

        function updateDetailLive(symbol) {
            let data = marketData[symbol];
            if (!data) return;
            document.getElementById('det-price').innerText = `$${data.price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4})}`;
            let changeEl = document.getElementById('det-change');
            let isPos = data.change >= 0;
            changeEl.className = `coin-change ${isPos ? 'positive' : 'negative'}`;
            changeEl.innerText = `${isPos ? '+' : ''}${data.change.toFixed(2)}% today`;
        }

        async function loadGoogleStyleChart(symbol) {
            let binanceSymbol = symbol + "USDT";
            try {
                let res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${binanceSymbol}&interval=1h&limit=24`);
                let candles = await res.json();
                let labels = []; let history = [];
                
                candles.forEach(c => {
                    let date = new Date(c[0]);
                    labels.push(date.getUTCHours().toString().padStart(2, '0') + ":00");
                    history.push(parseFloat(c[4])); 
                });

                let cp = history[history.length - 1];
                renderGoogleChart(labels, history, marketData[symbol].change >= 0);
            } catch (e) {}
        }

        function renderGoogleChart(labels, history, isPositive) {
            const ctx = document.getElementById('cryptoChart').getContext('2d');
            if (myChart) myChart.destroy();

            labels.push("Now", "+1h", "+2h", "+3h");
            let historyDataPoints = [...history, history[history.length - 1], null, null, null];
            
            let predictionDataPoints = new Array(history.length).fill(null);
            let cp = history[history.length - 1];
            predictionDataPoints.push(cp, cp, cp, cp); 

            let mainColor = isPositive ? '#81c995' : '#f28b82';
            let gradient = ctx.createLinearGradient(0, 0, 0, 350);
            gradient.addColorStop(0, isPositive ? 'rgba(129, 201, 149, 0.2)' : 'rgba(242, 139, 130, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0.0)');

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Market History', data: historyDataPoints,
                            borderColor: mainColor, backgroundColor: gradient, fill: true,
                            tension: 0.1, pointRadius: 0, pointHoverRadius: 6, borderWidth: 2
                        },
                        {
                            label: 'AI Prediction', data: predictionDataPoints,
                            borderColor: '#8ab4f8', borderDash: [5, 5], backgroundColor: 'transparent', fill: false,
                            tension: 0.2, pointRadius: 0, pointHoverRadius: 6, borderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            enabled: false,
                            external: function(context) {
                                let tooltipModel = context.tooltip;
                                let timeEl = document.getElementById('hover-time').querySelector('.data-value');
                                let priceEl = document.getElementById('hover-price').querySelector('.data-value');
                                let typeEl = document.getElementById('hover-type').querySelector('.data-value');
                                
                                if (tooltipModel.opacity === 0) {
                                    timeEl.innerHTML = "Hover over chart"; priceEl.innerHTML = "---";
                                    typeEl.innerHTML = "Market Data"; typeEl.style.color = "#8ab4f8";
                                    return;
                                }
                                
                                if (tooltipModel.body) {
                                    let index = tooltipModel.dataPoints[0].dataIndex;
                                    let label = labels[index];
                                    let isPrediction = tooltipModel.dataPoints[0].datasetIndex === 1 || index > history.length;
                                    let val = isPrediction ? myChart.data.datasets[1].data[index] : historyDataPoints[index];
                                    
                                    if (val) {
                                        timeEl.innerHTML = label;
                                        priceEl.innerHTML = `$${val.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4})}`;
                                        if (isPrediction || label.includes("+")) {
                                            typeEl.innerHTML = "Gemini AI Prediction"; typeEl.style.color = "#a8c7fa";
                                        } else {
                                            typeEl.innerHTML = "Real-time Market"; typeEl.style.color = "#81c995";
                                        }
                                    }
                                }
                            }
                        }
                    },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#9aa0a6' } },
                        y: { grid: { color: '#3c4043' }, ticks: { color: '#9aa0a6' }, position: 'right' }
                    }
                },
                plugins: [crosshairPlugin]
            });
        }

        function goBack() {
            selectedCoin = null; aiPredictions = null;
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            if (myChart) myChart.destroy();
            fetchMarketData();
        }

        fetchMarketData();
        setInterval(fetchMarketData, 5000); 
    </script>
</body>
</html>
